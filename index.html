    <style>
        #background {
            /* Fix the entire element to the top left corner of the screen */
            position: fixed;
            top: 0;
            left: 0;

            /* Make the element the same size as the screen */
            width: 100%;
            height: 100%;

            /* Maintain the size when the screen width is within 1000px */
            /* min-width: 1000px; */

            /* Position the element below other layers to achieve the background image effect */
            z-index: -10;

            /* Compatibility for IE: Set the scaling ratio of the object to automatically expand when floating */
            zoom: 1;

            /* Background image */
            background-image: url("https://www.bing.com/th?id=OHR.AveburyStones_EN-US9568662876_UHD.jpg");

            /* Set a white background color when there is no image */
            background-color: #fff;

            /* Do not repeat the background */
            background-repeat: no-repeat;

            /* Position the image at the center and align it to the left */
            background-position: center center;

            /* Scale the image to fit the screen, with some possible cropping to prevent white space */
            background-size: cover;

            /* Same as above, compatibility for Chrome and Opera */
            -webkit-background-size: cover;
            -o-background-size: cover;
        }
    </style>
</head>
<body>
    <a id="background" href="https://github.com" title="As morning mist drifts among the standing stones of Avebury in Wiltshire, England, the scene feels almost timeless. These ancient megaliths form part of one of the world's most remarkable prehistoric landscapes, centered on a vast Neolithic monument built around 4,500 years ago. Avebury contains the world's largest prehistoric stone circle, as well as a massive henge and stone avenues extending into the surrounding countryside. Together with nearby monuments such as Silbury Hill and West Kennet Avenue, it forms part of an extensive Neolithic complex that has fascinated generations of visitors, researchers, and archaeologists."></a>
