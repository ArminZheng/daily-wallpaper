        #background {
            /* Fix the entire element to the top left corner of the screen */

            top: 0;
            left: 0;

            /* Make the element the same size as the screen */
            width: 100%;
            height: 100%;

            /* Maintain the size when the screen width is within 1000px */
            /* min-width: 1000px; */

            z-index: -10;

            /* Compatibility for IE: Set the scaling ratio of the object to automatically expand when floating */

            background-image: url("https://www.bing.com/th?id=OHR.LakeFyans_EN-US4295341714_UHD.jpg");

            /* Set a white background color when there is no image */

            /* Do not repeat the background */
            background-repeat: no-repeat;

            /* Position the image at the center and align it to the left */
            background-position: center center;

            /* Scale the image to fit the screen, with some possible cropping to prevent white space */

            -o-background-size: cover;

    </style>

<body>
    <a id="background" href="https://github.com" title="At first glance, today's image looks more like a drowned woodland than a lake. Bare tree trunks emerge from the water, their reflections stretching across the surface as the Grampians glow in the distance. This is Lake Fyans, an artificial reservoir on the edge of the Grampians (Gariwerd) National Park in Victoria, Australia. Popular with boaters, anglers, sailors, and water-skiers, it offers a front-row seat to one of the country's most striking landscapes."></a>
