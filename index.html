<body>
    <a id="background" href="https://github.com" title="The image captures the jagged skyline of Cadini di Misurina at sunrise in Veneto, northeastern Italy. Visitors heading toward nearby Tre Cime di Lavaredo often come for the famous route only to find their attention hijacked by the Cadini. Part of the Dolomites, these needle-like peaks reaching more than 9,300 feet at their highest point seem sculpted for drama. The twist? They started out as ancient coral reefs."></a>
