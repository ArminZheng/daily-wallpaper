    <style>
        #background {
            /* Fix the entire element to the top left corner of the screen */
            position: fixed;
            top: 0;
            left: 0;

            /* Make the element the same size as the screen */
            width: 100%;
            height: 100%;

            /* Maintain the size when the screen width is within 1000px */
            /* min-width: 1000px; */

            /* Position the element below other layers to achieve the background image effect */
            z-index: -10;

            /* Compatibility for IE: Set the scaling ratio of the object to automatically expand when floating */
            zoom: 1;

            /* Background image */
            background-image: url("https://www.bing.com/th?id=OHR.WildTom_EN-US1069249609_UHD.jpg");

            /* Set a white background color when there is no image */
            background-color: #fff;

            /* Do not repeat the background */
            background-repeat: no-repeat;

            /* Position the image at the center and align it to the left */
            background-position: center center;

            /* Scale the image to fit the screen, with some possible cropping to prevent white space */
            background-size: cover;

            /* Same as above, compatibility for Chrome and Opera */
            -webkit-background-size: cover;
            -o-background-size: cover;
        }
    </style>
</head>
<body>
    <a id="background" href="https://github.com" title="With their colorful plumage and distinctive gobble, adult male turkeys, known as toms or gobblers, are a familiar sight of the season. Toms, like those pictured here, fan their tail feathers and show off their rich coloring to attract hens. These native birds can be found in the wild across much of North America, often in forest and woodland habitats. Turkeys have also become closely tied to Thanksgiving traditions, serving as a familiar centerpiece of a holiday feast that, for many, is less about what's on the table and more about gathering with family and friends. In today's image, two toms take a Thanksgiving stroll and put their finest feathers forward in the warm glow of autumn."></a>
