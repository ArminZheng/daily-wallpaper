        #background {

            top: 0;

            height: 100%;

            /* Maintain the size when the screen width is within 1000px */
            /* min-width: 1000px; */

            background-image: url("https://www.bing.com/th?id=OHR.Megaptera_EN-US1728719939_UHD.jpg");

            background-position: center center;

            /* Scale the image to fit the screen, with some possible cropping to prevent white space */

<body>
    <a id="background" href="https://github.com" title="Off the coast of Kvaløya in Troms, Northern Norway, humpback whales move through the cold Arctic waters in search of a proper feast. They visit this region during the winter months, following migrating herring into the fjords. Humpbacks are famous for bubble-net feeding, a remarkable hunting technique in which whales blow rings of bubbles to corral fish before lunging upward, open-mouthed, to catch their prey. In today's image, a humpback slips beneath the icy waves under a glowing pastel sky, capturing a moment of tranquility in Norway's wild north."></a>
